# Shoallhell on Fly.io: one small always-on machine with a 1 GB volume for accounts and saves.
#   fly launch --no-deploy --copy-config   (once; pick the app name, then)
#   fly volumes create shoallhell_data --size 1 --region ord
#   fly deploy
app = 'shoallhell'
primary_region = 'ord'
kill_signal = 'SIGINT'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATA_DIR = '/data'
  PORT = '3031'
  ALLOWED_ORIGINS = 'https://josephjackman.com,https://www.josephjackman.com'

[[mounts]]
  source = 'shoallhell_data'
  destination = '/data'

[http_service]
  internal_port = 3031
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '15s'
    interval = '30s'
    method = 'GET'
    path = '/games/shoallhell/api/ping'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
